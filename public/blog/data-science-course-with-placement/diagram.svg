erms and conditions apply</text><ellipse cx="190" cy="450" rx="118" ry="22" fill="none" stroke="#b86b12" stroke-width="3"/><line x1="310" y1="440" x2="470" y2="300" stroke="#b86b12" stroke-width="2.5" marker-end="url(#arrow-b86b12)"/><rect x="480" y="50" width="660" height="72" rx="12" fill="#fdf3e6" stroke="#f5a44a" stroke-width="2" /><text x="510" y="82" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1b26" text-anchor="start" >1. Attendance rule</text><text x="510" y="106" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5a67" text-anchor="start" >what share of classes, and is it realistic?</text><rect x="480" y="138" width="660" height="72" rx="12" fill="#ffffff" stroke="#f5a44a" stroke-width="2" /><text x="510" y="170" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1b26" text-anchor="start" >2. Assignment and test scores</text><text x="510" y="194" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5a67" text-anchor="start" >the thresholds you must hit</text><rect x="480" y="226" width="660" height="72" rx="12" fill="#fdf3e6" stroke="#f5a44a" stroke-width="2" /><text x="510" y="258" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1b26" text-anchor="start" >3. Salary floor and role</text><text x="510" y="282" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5a67" text-anchor="start" >what counts as a placement</text><rect x="480" y="314" width="660" height="72" rx="12" fill="#ffffff" stroke="#f5a44a" stroke-width="2" /><text x="510" y="346" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1b26" text-anchor="start" >4. Time limit</text><text x="510" y="370" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5a67" text-anchor="start" >how long after the course it lasts</text><rect x="480" y="402" width="660" height="72" rx="12" fill="#fdf3e6" stroke="#f5a44a" stroke-width="2" /><text x="510" y="434" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#0e1b26" text-anchor="start" >5. Refund terms</text><text x="510" y="458" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5a67" text-anchor="start" >how much, how soon, on what proof</text></svg>
