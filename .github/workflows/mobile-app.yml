# Ships the Android app from mobile/ whenever it changes on main.
#
# When the version in mobile/app.json has no GitHub release yet, this builds
# the APK here on GitHub (expo prebuild, then Gradle) and publishes it as
# release app-v<version> with NectArray.apk attached, always downloadable from
# https://github.com/satyaprakashdhfm/Nectarray/releases/latest/download/NectArray.apk
# Installed apps see the new release when they next open and offer it.
# A change without a version bump builds nothing: raise the version to ship.
#
# Needs two repository secrets, both from the signing key kept off the repo:
#   ANDROID_KEYSTORE           the key file (release.p12), base64
#   ANDROID_KEYSTORE_PASSWORD  its password
# Every release must be signed with that same key, or Android refuses to
# install it over the one already on the phone. Without them the workflow
# skips with a note instead of failing.
name: Mobile app

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/mobile-app.yml']
  workflow_dispatch:

concurrency:
  group: mobile-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          version=$(jq -r '.expo.version' mobile/app.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "app-v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::app-v$version is already released. Raise version in mobile/app.json to ship a new APK."
          elif [ "$HAS_KEY" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD repository secrets to build the app."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Android only installs over an older versionCode, so it follows the
      # version: 1.2.3 becomes 10203.
      - name: Set the versionCode
        run: |
          code=$(echo "$VERSION" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          jq --argjson code "$code" '.expo.android.versionCode = $code' app.json > app.tmp && mv app.tmp app.json
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build the APK
        working-directory: mobile/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
            -Pandroid.injected.signing.store.password="$KEY_PASSWORD" \
            -Pandroid.injected.signing.key.alias=nectarray \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../NectArray.apk
      - name: Check it carries the release key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner
          "$apksigner" verify --print-certs NectArray.apk | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::The APK is signed with the debug key, not the release key."
            exit 1
          fi
      - name: Publish the GitHub release
        run: |
          gh release create "app-v$VERSION" NectArray.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NectArray $VERSION for Android" \
            --latest \
            --notes "Download **NectArray.apk** below on an Android phone and open it to install. If NectArray is already installed, this installs over it and keeps your sign-in."
